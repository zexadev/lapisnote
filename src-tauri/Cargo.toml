[package]
name = "app"
version = "3.0.1"
description = "Lapis — a calm, local-first notes app"
authors = ["zexa (zexadev) <https://zexa.cc>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/zexadev/lapisnote"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["net", "io-util", "sync"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
urlencoding = "2.1.3"
# 关默认 feature：default-tls 是 native-tls，在 Android 目标要 openssl-sys，没有系统 OpenSSL 直接编不过；
# 且两套后端同时开时 reqwest 默认选 native-tls，这里声明的 rustls 从未生效过。
# json 也必须自己开：桌面上它是 tauri-plugin-updater 顺带打开的，手机目标没有 updater。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2", "system-proxy"] }
scraper = "0.26.0"
ego-tree = "0.11.0"
# P2P 跨网同步
iroh = "1.0.0"
# 三路文本合并（git 式 diff3）
diffy = "0.4"
# 图片附件：内容寻址（sha256）+ base64 编解码
sha2 = "0.10"
base64 = "0.22"
# 选真实局域网网卡 IP（避开 Docker/WSL 虚拟网卡），与 iroh 共用同版本
netdev = "0.44"
# 局域网设备自动发现：mDNS / DNS-SD 广播 + 浏览
mdns-sd = "0.13"
# 手机端应用内更新：比 latest.json 里的版本号（tauri 的 PackageInfo.version 就是这个类型）
semver = "1"

# 桌面专属：托盘、单实例、自更新、进程控制、MCP HTTP server（rmcp/axum/schemars）、
# 往桌面 AI 工具配置文件里登记（dirs）。手机没有托盘/自更新（侧载）/MCP 宿主。
# cargo 的 target 表只认 rustc 内建 cfg，tauri-build 注入的 cfg(desktop) 在这里不生效，
# 所以这里必须写 target_os；源码里照用 #[cfg(desktop)]。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2.9.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rmcp = { version = "1", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
schemars = "1.0"
dirs = "6"
